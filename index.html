<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | طارق زهران - إسماعيلية</title>
    <style>
        :root {
            --primary: #0d6b6e;
            --primary-light: #e0f2f3;
            --primary-dark: #06474a;
            --accent: #e8913a;
            --accent-light: #fef3e8;
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --border: #e8eaef;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Tajawal', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .header {
            background: linear-gradient(135deg, #06474a 0%, #0a5c60 100%);
            color: #fff;
            padding: 20px 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(13, 107, 110, 0.25);
            border-radius: 0 0 28px 28px;
            backdrop-filter: blur(10px);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 .icon {
            font-size: 1.6rem;
        }
        .header .badge-area {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header .subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-top: 6px;
            font-weight: 400;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 16px 30px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: default;
        }
        .stat-card:active {
            transform: scale(0.97);
            box-shadow: var(--shadow);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            background: var(--primary-light);
            color: var(--primary);
        }
        .stat-icon.blue {
            background: #e8f0fe;
            color: #1a73e8;
        }
        .stat-info {
            min-width: 0;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .search-section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            border: 1px solid var(--border);
            position: relative;
            z-index: 50;
        }
        .search-label {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .search-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 14px 46px 14px 46px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: #f9fafb;
            color: var(--text);
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
            direction: rtl;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 107, 110, 0.08);
            background: #fff;
        }
        .search-input::placeholder {
            color: #b0b0c0;
            font-size: 0.9rem;
        }
        .search-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #999;
            pointer-events: none;
        }
        .search-icon.right {
            right: 16px;
        }
        .search-icon.left {
            left: 12px;
            cursor: pointer;
            pointer-events: auto;
            font-size: 1rem;
            color: #aaa;
            background: none;
            border: none;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .search-icon.left:hover {
            color: #666;
            background: #f0f0f0;
        }
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            box-shadow: var(--shadow-lg);
            max-height: 250px;
            overflow-y: auto;
            z-index: 60;
            margin-top: 6px;
            display: none;
        }
        .suggestions-dropdown.active {
            display: block;
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            gap: 8px;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:active,
        .suggestion-item:hover {
            background: var(--primary-light);
        }
        .suggestion-item .code {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }
        .suggestion-item .name {
            flex: 1;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .suggestion-item .area-tag {
            font-size: 0.7rem;
            background: #f0f0f5;
            padding: 4px 10px;
            border-radius: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .no-results {
            padding: 18px;
            text-align: center;
            color: #999;
            font-size: 0.85rem;
        }
        .result-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeInUp 0.35s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-header {
            background: linear-gradient(135deg, #f8fafb 0%, #f0f4f5 100%);
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-header .cust-name {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
        }
        .result-header .cust-code {
            font-size: 0.8rem;
            background: var(--primary);
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 600;
            white-space: nowrap;
        }
        .result-body {
            padding: 18px 20px;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .info-row .info-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8rem;
            white-space: nowrap;
            min-width: 60px;
        }
        .info-row .info-value {
            color: var(--text);
            font-weight: 500;
            background: #f8f9fb;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
        }
        .fridge-section-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fridge-count-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 14px;
            font-weight: 600;
        }
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            margin-bottom: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 400px;
        }
        table thead {
            background: #f4f5f7;
            position: sticky;
            top: 0;
        }
        table th {
            padding: 12px 10px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            white-space: nowrap;
            border-bottom: 2px solid #ddd;
        }
        table td {
            padding: 10px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 0.8rem;
            font-weight: 500;
        }
        table tbody tr {
            transition: background 0.15s;
        }
        table tbody tr:active {
            background: #f8fafb;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }
        .empty-state .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 14px;
            opacity: 0.7;
        }
        .empty-state p {
            font-size: 1rem;
            font-weight: 500;
        }
        .empty-state .hint {
            font-size: 0.8rem;
            color: #bbb;
            margin-top: 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        @media (max-width: 480px) {
            .stats-row {
                gap: 10px;
            }
            .stat-card {
                padding: 14px 12px;
                gap: 10px;
            }
            .stat-icon {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
                border-radius: 12px;
            }
            .stat-value {
                font-size: 1.3rem;
            }
            .stat-label {
                font-size: 0.65rem;
            }
            .header h1 {
                font-size: 1.15rem;
            }
            .header {
                padding: 14px 16px 18px;
                border-radius: 0 0 20px 20px;
            }
            .search-input {
                padding: 12px 40px 12px 40px;
                font-size: 0.9rem;
            }
            .result-header {
                padding: 14px 16px;
            }
            .result-body {
                padding: 14px 16px;
            }
        }
    </style>
</head>

                ["25697", "بقالة الشباب", "Madint El-Asher", "Tarek Zahran Ismailia", "22EG04230", "", "لا", "", "", "", "", ""],
                ["25789", "ماركت هوم باور", "Madint El-Asher", "Tarek Zahran Ismailia", "22EG05131", "10015785", "نعم", "", "", "", "", ""],
                ["25468", "بقالة رزق", "EL Asher", "Tarek Zahran Ismailia", "24EG02716", "", "لا", "", "", "", "", ""],
                ["25573", "ماركت الحكيم", "EL Asher", "Tarek Zahran Ismailia", "24EG03861", "", "لا", "", "", "", "", ""],
                ["25488", "بقاله عماد", "EL Asher", "Tarek Zahran Ismailia", "24EG01182", "10118454", "نعم", "", "", "", "", ""],
                ["25689", "اسواق بدر", "Madint El-Asher", "Tarek Zahran Ismailia", "22EG11871", "", "لا", "", "", "", "", ""],
                ["25120", "بقالة التوأمان", "El Ordonia", "Tarek Zahran Ismailia", "19EG09824", "", "لا", "", "", "", "", ""],
                ["25119", "بقالة العائلات", "El Ordonia", "Tarek Zahran Ismailia", "25EG00395", "", "لا", "", "", "", "", ""]
            ];

            const customersMap = new Map();
            const allFridges = [];

            rawData.forEach(row => {
                const record = {
                    code: row[0],
                    name: row[1],
                    area: row[2],
                    agent: row[3],
                    fridgeNumber: row[4],
                    hasBarcode: row[6]
                };
                allFridges.push(record);

                if (!customersMap.has(record.code)) {
                    customersMap.set(record.code, {
                        code: record.code,
                        name: record.name,
                        area: record.area,
                        agent: record.agent,
                        fridges: []
                    });
                }
                customersMap.get(record.code).fridges.push(record);
            });

            const uniqueCustomers = Array.from(customersMap.values());
            const totalFridges = allFridges.length;

            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const suggestionsDropdown = document.getElementById('suggestionsDropdown');
            const resultsArea = document.getElementById('resultsArea');
            const emptyState = document.getElementById('emptyState');
            const toast = document.getElementById('toast');
            const statCustomers = document.getElementById('statCustomers');
            const statFridges = document.getElementById('statFridges');

            statCustomers.textContent = uniqueCustomers.length;
            statFridges.textContent = totalFridges;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
            }

            function getAreaDisplay(area) {
                if (area === 'EL Asher') return 'العاشر - EL Asher';
                if (area === 'Madint El-Asher') return 'مدينة العاشر';
                if (area === 'El Ordonia') return 'الأردنية';
                return area;
            }

            function renderCustomerResult(customer) {
                const fridgeCount = customer.fridges.length;
                let fridgeRows = '';
                customer.fridges.forEach((f, idx) => {
                    fridgeRows += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${f.fridgeNumber}</td>
                        </tr>`;
                });

                return `
                    <div class="result-card">
                        <div class="result-header">
                            <span class="cust-name">🏪 ${customer.name}</span>
                            <span class="cust-code">#${customer.code}</span>
                        </div>
                        <div class="result-body">
                            <div class="info-row">
                                <span class="info-label">📌 المنطقة:</span>
                                <span class="info-value">${getAreaDisplay(customer.area)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">👤 الوكيل:</span>
                                <span class="info-value">${customer.agent}</span>
                            </div>
                            <div class="info-row" style="margin-top: 8px;">
                                <span class="badge">❄️ ${fridgeCount} ثلاجة</span>
                            </div>
                            <div class="fridge-section-title">
                                📋 قائمة الثلاجات <span class="fridge-count-badge">${fridgeCount}</span>
                            </div>
                            <div class="table-wrapper">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>رقم / اسم الثلاجة</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${fridgeRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            function searchCustomer(code) {
                const cleanCode = code.trim();
                if (!cleanCode) return null;
                if (customersMap.has(cleanCode)) {
                    return customersMap.get(cleanCode);
                }
                for (const [key, val] of customersMap) {
                    if (key.includes(cleanCode)) {
                        return val;
                    }
                }
                return null;
            }

            function getSuggestions(query) {
                const q = query.trim();
                if (!q) return [];
                const results = [];
                for (const [code, cust] of customersMap) {
                    if (code.includes(q) || cust.name.includes(q)) {
                        results.push({ code, name: cust.name, area: cust.area, fridgeCount: cust.fridges.length });
                        if (results.length >= 15) break;
                    }
                }
                return results;
            }

            function displayCustomer(customer) {
                resultsArea.innerHTML = renderCustomerResult(customer);
                emptyState.style.display = 'none';
                const firstCard = resultsArea.querySelector('.result-card');
                if (firstCard) {
                    firstCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function clearResults() {
                resultsArea.innerHTML = '';
                resultsArea.appendChild(emptyState);
                emptyState.style.display = '';
                searchInput.value = '';
                suggestionsDropdown.classList.remove('active');
                searchInput.focus();
            }

            searchInput.addEventListener('input', function() {
                const query = this.value;
                if (!query.trim()) {
                    suggestionsDropdown.classList.remove('active');
                    return;
                }
                const suggestions = getSuggestions(query);
                if (suggestions.length === 0) {
                    suggestionsDropdown.innerHTML = '<div class="no-results">😔 لا توجد نتائج مطابقة</div>';
                } else {
                    suggestionsDropdown.innerHTML = suggestions.map(s => `
                        <div class="suggestion-item" data-code="${s.code}">
                            <span class="code">🔢 ${s.code}</span>
                            <span class="name">${s.name}</span>
                            <span class="area-tag">📍 ${getAreaDisplay(s.area)} · ${s.fridgeCount} ثلاجة</span>
                        </div>
                    `).join('');
                }
                suggestionsDropdown.classList.add('active');
            });

            suggestionsDropdown.addEventListener('click', function(e) {
                const item = e.target.closest('.suggestion-item');
                if (!item) return;
                const code = item.dataset.code;
                const customer = customersMap.get(code);
                if (customer) {
                    searchInput.value = code;
                    suggestionsDropdown.classList.remove('active');
                    displayCustomer(customer);
                    showToast(`✅ تم العثور على: ${customer.name} - ${customer.fridges.length} ثلاجة`);
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.trim();
                    if (!query) return;
                    const customer = searchCustomer(query);
                    suggestionsDropdown.classList.remove('active');
                    if (customer) {
                        displayCustomer(customer);
                        showToast(`✅ تم العثور على: ${customer.name}`);
                    } else {
                        showToast('❌ لم يتم العثور على العميل بهذا الكود');
                        resultsArea.innerHTML = `
                            <div class="empty-state">
                                <span class="icon">🔍</span>
                                <p>لم يتم العثور على عميل بالكود "${query}"</p>
                                <span class="hint">جرب كود آخر أو استخدم الاقتراحات</span>
                            </div>
                        `;
                    }
                }
            });

            clearBtn.addEventListener('click', function() {
                clearResults();
                showToast('🗑️ تم مسح البحث');
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-wrapper')) {
                    suggestionsDropdown.classList.remove('active');
                }
            });

            setTimeout(() => searchInput.focus(), 300);
            console.log('✅ لوحة التحكم جاهزة |', uniqueCustomers.length, 'عميل |', totalFridges, 'ثلاجة');
        })();
    </script>
</body>
</html>
