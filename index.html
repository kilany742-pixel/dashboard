<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - طارق زهران | إسماعيلية</title>
    <style>
        :root {
            --primary: #0d6b6e;
            --primary-light: #e0f2f3;
            --primary-dark: #06474a;
            --accent: #e8913a;
            --accent-light: #fef3e8;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --border: #e4e7ed;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Tajawal', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            padding-bottom: env(safe-area-inset-bottom, 30px);
        }
        .header {
            background: linear-gradient(135deg, #054045 0%, #0a5f64 40%, #0d7a7f 100%);
            color: #fff;
            padding: 18px 20px 22px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 6px 28px rgba(6, 71, 74, 0.3);
            border-radius: 0 0 30px 30px;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 .icon {
            font-size: 1.5rem;
        }
        .header .badge-area {
            font-size: 0.73rem;
            background: rgba(255, 255, 255, 0.16);
            padding: 6px 14px;
            border-radius: 22px;
            font-weight: 500;
            backdrop-filter: blur(6px);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header .subtitle {
            font-size: 0.78rem;
            opacity: 0.82;
            margin-top: 5px;
            font-weight: 400;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 16px 16px 36px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            opacity: 0.06;
            transition: var(--transition);
        }
        .stat-card:active {
            transform: scale(0.96);
            box-shadow: var(--shadow);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .stat-icon.teal {
            background: var(--primary-light);
            color: var(--primary);
        }
        .stat-icon.blue {
            background: #e8f0fe;
            color: #1a73e8;
        }
        .stat-info {
            min-width: 0;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.2px;
            margin-top: 2px;
        }
        .search-section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            position: relative;
            z-index: 50;
        }
        .search-label {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .search-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 14px 44px 14px 44px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: #f9fafb;
            color: var(--text);
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
            direction: rtl;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(13, 107, 110, 0.07);
            background: #fff;
        }
        .search-input::placeholder {
            color: #b8b8c8;
            font-size: 0.88rem;
        }
        .search-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.15rem;
            color: #aaa;
            pointer-events: none;
        }
        .search-icon.right {
            right: 15px;
        }
        .search-icon.left {
            left: 10px;
            cursor: pointer;
            pointer-events: auto;
            font-size: 0.95rem;
            color: #bbb;
            background: none;
            border: none;
            padding: 7px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .search-icon.left:hover {
            color: #777;
            background: #f0f0f0;
        }
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            box-shadow: var(--shadow-lg);
            max-height: 280px;
            overflow-y: auto;
            z-index: 60;
            margin-top: 6px;
            display: none;
        }
        .suggestions-dropdown.active {
            display: block;
        }
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f3f3f7;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:active,
        .suggestion-item:hover {
            background: var(--primary-light);
        }
        .suggestion-item .code {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.82rem;
            white-space: nowrap;
            min-width: 48px;
            text-align: center;
        }
        .suggestion-item .name {
            flex: 1;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .suggestion-item .area-tag {
            font-size: 0.68rem;
            background: #f3f4f8;
            padding: 3px 10px;
            border-radius: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .no-results {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 0.85rem;
        }
        .result-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
            transition: var(--transition);
        }
        .result-card:hover {
            box-shadow: var(--shadow-lg);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-header {
            background: linear-gradient(135deg, #f8fafb 0%, #eef2f5 100%);
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
        }
        .result-header .cust-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }
        .result-header .cust-code {
            font-size: 0.78rem;
            background: var(--primary);
            color: #fff;
            padding: 5px 14px;
            border-radius: 16px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }
        .result-header .cust-code:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }
        .result-body {
            padding: 16px 18px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .info-item {
            background: #f9fafc;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
        }
        .info-item .info-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.7rem;
            display: block;
            margin-bottom: 3px;
        }
        .info-item .info-value {
            color: var(--text);
            font-weight: 500;
            font-size: 0.83rem;
            word-break: break-word;
        }
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.74rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
        }
        .badge-accent {
            background: var(--accent-light);
            color: #b05c1a;
        }
        .fridge-section-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin: 18px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .fridge-count-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 14px;
            font-weight: 600;
        }
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            margin-bottom: 6px;
            display: none;
        }
        .table-wrapper.open {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 350px;
        }
        table thead {
            background: #f4f5f7;
        }
        table th {
            padding: 11px 10px;
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-align: center;
            border-bottom: 2px solid #ddd;
        }
        table td {
            padding: 10px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-weight: 500;
            font-size: 0.76rem;
        }
        table tbody tr {
            transition: background 0.15s;
        }
        table tbody tr:hover {
            background: #fafcfd;
        }
        .empty-state {
            text-align: center;
            padding: 55px 20px;
            color: #bbb;
        }
        .empty-state .icon {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 14px;
            opacity: 0.65;
        }
        .empty-state p {
            font-size: 0.95rem;
            font-weight: 500;
            color: #999;
        }
        .empty-state .hint {
            font-size: 0.75rem;
            color: #c5c5c5;
            margin-top: 5px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c3a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 26px;
            font-size: 0.85rem;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
            font-weight: 500;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        @media (max-width: 500px) {
            .stats-row {
                gap: 10px;
            }
            .stat-card {
                padding: 14px 12px;
                gap: 10px;
            }
            .stat-icon {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
                border-radius: 12px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .header {
                padding: 14px 16px 18px;
                border-radius: 0 0 22px 22px;
            }
            .search-input {
                padding: 12px 38px 12px 38px;
                font-size: 0.9rem;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .result-header {
                padding: 14px 16px;
            }
            .result-body {
                padding: 12px 14px;
            }
            table {
                font-size: 0.7rem;
                min-width: 300px;
            }
        }
    </style>
</head>

                ["25545", "24EG09034"], ["25215", "25EG00676"], ["25617", "NF17-0445N"],
                ["25150", "22EG10378"], ["25564", "EJ13-1377N"], ["25804", "22EG06663"],
                ["25540", "24EG02546"], ["25740", "24EG09597"], ["25774", "23EG00629"],

                ["25152", "24EG08174"], ["25237", "26EG04076"], ["25749", "24EG06473"],
                ["24950", "26EG03589"], ["25790", "EJ13-0348N"], ["25481", "22EG10376"],
                ["25735", "EJ13-0743N"], ["25697", "22EG04230"], ["25789", "22EG05131"],
                ["25468", "24EG02716"], ["25573", "24EG03861"], ["25488", "24EG01182"],
                ["25689", "22EG11871"], ["25120", "19EG09824"], ["25119", "25EG00395"]
            ];

            // ==================== BUILD MERGED DATABASE ====================
            const customersMap = new Map();
            const oldCodeMap = new Map();

            excelData.forEach(row => {
                const code = row[0];
                const oldCode = row[1];
                const name = row[2];
                const area = row[3];
                const legalName = row[4];
                const address = row[5];
                // creditLimit is not used anymore

                if (!customersMap.has(code)) {
                    customersMap.set(code, {
                        code,
                        oldCode,
                        name,
                        area,
                        legalName,
                        address,
                        fridges: []
                    });
                }
                if (oldCode && oldCode !== '#N/A' && oldCode.trim() !== '') {
                    oldCodeMap.set(oldCode.trim(), code);
                }
            });

            let totalFridges = 0;
            fridgeData.forEach(row => {
                const code = row[0];
                const fridgeNumber = row[1];
                if (customersMap.has(code)) {
                    customersMap.get(code).fridges.push(fridgeNumber);
                    totalFridges++;
                }
            });

            const uniqueCustomers = Array.from(customersMap.values());

            // ==================== DOM ELEMENTS ====================
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const suggestionsDropdown = document.getElementById('suggestionsDropdown');
            const resultsArea = document.getElementById('resultsArea');
            const emptyState = document.getElementById('emptyState');
            const toast = document.getElementById('toast');
            const statCustomers = document.getElementById('statCustomers');
            const statFridges = document.getElementById('statFridges');

            statCustomers.textContent = uniqueCustomers.length;
            statFridges.textContent = totalFridges;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function getAreaDisplay(area) {
                if (area === 'EL Asher') return 'العاشر من رمضان';
                if (area === 'Madint El-Asher') return 'مدينة العاشر';
                if (area === 'El Ordonia') return 'الأردنية';
                return area;
            }

            function renderCustomerResult(customer) {
                const fridgeCount = customer.fridges.length;
                let fridgeRows = '';
                customer.fridges.forEach((fn, idx) => {
                    fridgeRows += `<tr><td>${idx + 1}</td><td>${fn}</td></tr>`;
                });

                const hasFridges = fridgeCount > 0;
                const fridgeSectionHTML = hasFridges ? `
                    <div class="fridge-section-title" onclick="this.nextElementSibling.classList.toggle('open')">
                        📋 قائمة الثلاجات <span class="fridge-count-badge">${fridgeCount}</span>
                        <span style="margin-right:auto;font-size:0.7rem;color:#999;">▼ اضغط للعرض</span>
                    </div>
                    <div class="table-wrapper open">
                        <table>
                            <thead><tr><th>#</th><th>رقم / اسم الثلاجة</th></tr></thead>
                            <tbody>${fridgeRows}</tbody>
                        </table>
                    </div>` : `
                    <div style="padding:12px;text-align:center;color:#999;font-size:0.82rem;">
                        ⚠️ لا توجد ثلاجات مسجلة لهذا العميل
                    </div>`;

                // Note: credit limit section removed completely
                return `
                    <div class="result-card">
                        <div class="result-header">
                            <span class="cust-name">🏪 ${customer.name}</span>
                            <span class="cust-code" title="اضغط لنسخ الكود" onclick="navigator.clipboard.writeText('${customer.code}');showToast('📋 تم نسخ الكود: ${customer.code}')">#${customer.code}</span>
                        </div>
                        <div class="result-body">
                            <div class="info-grid">
                                <div class="info-item"><span class="info-label">📌 المنطقة</span><span class="info-value">${getAreaDisplay(customer.area)}</span></div>
                                <div class="info-item"><span class="info-label">🔢 الكود القديم</span><span class="info-value">${customer.oldCode || '-'}</span></div>
                                <div class="info-item"><span class="info-label">👤 الاسم القانوني</span><span class="info-value">${customer.legalName || '-'}</span></div>
                                <div class="info-item"><span class="info-label">📍 العنوان</span><span class="info-value">${customer.address || '-'}</span></div>
                                <div class="info-item"><span class="info-label">❄️ الثلاجات</span><span class="info-value">${fridgeCount} ثلاجة</span></div>
                            </div>
                            ${fridgeSectionHTML}
                        </div>
                    </div>`;
            }

            function searchCustomer(query) {
                const q = query.trim();
                if (!q) return null;
                if (customersMap.has(q)) return customersMap.get(q);
                if (oldCodeMap.has(q)) {
                    const newCode = oldCodeMap.get(q);
                    return customersMap.get(newCode);
                }
                for (const [code, cust] of customersMap) {
                    if (cust.name.includes(q)) return cust;
                    if (cust.oldCode && cust.oldCode.includes(q)) return cust;
                }
                for (const [code, cust] of customersMap) {
                    if (code.includes(q)) return cust;
                }
                return null;
            }

            function getSuggestions(query) {
                const q = query.trim();
                if (!q) return [];
                const results = [];
                for (const [code, cust] of customersMap) {
                    if (code.includes(q) || cust.name.includes(q) || (cust.oldCode && cust.oldCode.includes(
                            q))) {
                        results.push({ code, name: cust.name, area: cust.area, oldCode: cust.oldCode,
                            fridgeCount: cust.fridges.length });
                        if (results.length >= 20) break;
                    }
                }
                return results;
            }

            function displayCustomer(customer) {
                resultsArea.innerHTML = renderCustomerResult(customer);
                emptyState.style.display = 'none';
                const firstCard = resultsArea.querySelector('.result-card');
                if (firstCard) firstCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function clearResults() {
                resultsArea.innerHTML = '';
                resultsArea.appendChild(emptyState);
                emptyState.style.display = '';
                searchInput.value = '';
                suggestionsDropdown.classList.remove('active');
                searchInput.focus();
            }

            searchInput.addEventListener('input', function() {
                const query = this.value;
                if (!query.trim()) { suggestionsDropdown.classList.remove('active'); return; }
                const suggestions = getSuggestions(query);
                if (suggestions.length === 0) {
                    suggestionsDropdown.innerHTML =
                        '<div class="no-results">😔 لا توجد نتائج مطابقة</div>';
                } else {
                    suggestionsDropdown.innerHTML = suggestions.map(s => `
                        <div class="suggestion-item" data-code="${s.code}">
                            <span class="code">${s.oldCode ? '📟' : '🔢'} ${s.code}</span>
                            <span class="name">${s.name}</span>
                            <span class="area-tag">📍 ${getAreaDisplay(s.area)} · ${s.fridgeCount} ❄️</span>
                        </div>
                    `).join('');
                }
                suggestionsDropdown.classList.add('active');
            });

            suggestionsDropdown.addEventListener('click', function(e) {
                const item = e.target.closest('.suggestion-item');
                if (!item) return;
                const code = item.dataset.code;
                const customer = customersMap.get(code);
                if (customer) {
                    searchInput.value = code;
                    suggestionsDropdown.classList.remove('active');
                    displayCustomer(customer);
                    showToast(`✅ ${customer.name} - ${customer.fridges.length} ثلاجة`);
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.trim();
                    if (!query) return;
                    const customer = searchCustomer(query);
                    suggestionsDropdown.classList.remove('active');
                    if (customer) {
                        displayCustomer(customer);
                        showToast(`✅ ${customer.name}`);
                    } else {
                        showToast('❌ لم يتم العثور على العميل');
                        resultsArea.innerHTML = `
                            <div class="empty-state">
                                <span class="icon">🔍</span>
                                <p>لم يتم العثور على عميل بالبحث "${query}"</p>
                                <span class="hint">جرب كود آخر أو جزء من الاسم أو الكود القديم</span>
                            </div>`;
                    }
                }
            });

            clearBtn.addEventListener('click', () => { clearResults();
                showToast('🗑️ تم مسح البحث'); });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-wrapper')) suggestionsDropdown.classList.remove('active');
            });

            document.getElementById('statCustomersCard').addEventListener('click', () => {
                showToast(`👥 إجمالي العملاء: ${uniqueCustomers.length} عميل`);
            });
            document.getElementById('statFridgesCard').addEventListener('click', () => {
                showToast(`❄️ إجمالي الثلاجات: ${totalFridges} ثلاجة`);
            });

            setTimeout(() => searchInput.focus(), 400);
            console.log('✅ تم دمج البيانات بنجاح |', uniqueCustomers.length, 'عميل |', totalFridges,
                'ثلاجة | بحث بالكود الجديد والقديم');
        })();
    </script>
